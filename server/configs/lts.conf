# This file is served via TFTP from /var/lib/tftpboot/ltsp/<arch>/lts.conf
# when using the default NBD setup.
# If using NFS, it goes in /opt/ltsp/<arch>/etc/lts.conf.
# See lts.conf(5) for the directives this fork adds or changes; the full
# upstream list is at http://manpages.ubuntu.com/lts.conf
# Lines starting with '#' are comments.
# Avoid empty [Sections] as they're considered syntax errors.


# This section applies to all clients and is overriden by the other sections.
[Default]
# For troubleshooting, the following open a local console with Alt+Ctrl+F2.
#SCREEN_02=shell
#SCREEN_07=ldm

# Don't encrypt X traffic. Gives much faster graphics at a security cost.
LDM_DIRECTX=True

# Force all clients to a specific resolution.
#XRANDR_MODE_0=1024x768
#XRANDR_RATE_0=85

# If the default 16bit color mode is giving you problems on thin clients:
#X_SMART_COLOR_DEPTH=False

# Separate fat clients from thin clients based on their RAM.
#FAT_RAM_THRESHOLD=400

# Use any local swap partitions on the clients.
USE_LOCAL_SWAP=True

# Provide a "Login as Guest" button, which uses LDM_USERNAME/LDM_PASSWORD.
#LDM_GUESTLOGIN=True

# Automatically login clients with the specified LDM_USERNAME/LDM_PASSWORD.
#LDM_AUTOLOGIN=True

# Map HOSTNAMEs to LDM_USERNAMEs. E.g. for HOSTNAME=pc01, LDM_USERNAME=guest01.
#HOST_TO_USERNAME="pc/guest"

# Some other frequently used directives, described in the lts.conf manpage.
# For really low RAM clients, disable SOUND, LOCAL_APPS and LOCALDEV.
#SOUND=False
#VOLUME=50
#LOCAL_APPS=False
#LOCAL_APPS_EXTRAMOUNTS=/srv
#LOCALDEV=False
#LOCALDEV_DENY_INTERNAL_DISKS=False
#FSTAB_1="server:/home    /home           nfs     defaults,nolock 0       0"
#XSERVER=vesa
#X_BLANKING=0
#X_NUMLOCK=True
#XKBLAYOUT="us,gr"
#XKBOPTIONS="grp:alt_shift_toggle,grp_led:scroll"
#LDM_LIMIT_ONE_SESSION=True
#LDM_LIMIT_ONE_SESSION_PROMPT=True
#LDM_PRINTER_DEFAULT="psc-1310-series"


# ---------------------------------------------------------------------
# RDP backend (ldm 3.x with the xfreerdp plugin)
# ---------------------------------------------------------------------

# Which backend ldm uses to open the session. Precedence in ldm is
# LDM_FORCE_BACKEND > the greeter's choice > LDM_DEFAULT_BACKEND > "ssh".
#LDM_DEFAULT_BACKEND="xfreerdp"

# Where the session is opened. Point this at the load balancer's virtual
# address rather than at a session server, so a failed server moves its
# users without anyone editing a client.
#RDP_SERVER="172.17.249.222"

# Passed through to xfreerdp. /dynamic-resolution follows the client's
# window size, /sound and /clipboard redirect those channels.
#RDP_OPTIONS="/cert:ignore /dynamic-resolution /sound /clipboard"

# Check the password against the KDC *before* starting the RDP client.
# Off by default, and worth understanding before switching on: xrdp has no
# server-side NLA, so it accepts a connection whatever the password is and
# validates inside the session, in its own dialog. A wrong password
# therefore does not end the connection - ldm never regains control and
# cannot tell the user what went wrong, and the connection stays open
# (measured against xrdp 0.10.1: a full minute after AUTHFAIL). With this
# set, ldm asks the KDC first and reports the real reason in the greeter:
# wrong password, locked account, expired password, clock skew, KDC
# unreachable. It fails open - any configuration problem lets the
# connection proceed exactly as before.
#
# It does not make the client a domain member: no machine account, no
# keytab, only the user's own credentials, and the ticket is discarded as
# soon as it arrives.
#RDP_PREAUTH=True
# Realm for the check above. Defaults to the system default realm.
#RDP_PREAUTH_REALM=LTSPLAB.LOCAL

# ---------------------------------------------------------------------
# Keyboard, and why it belongs next to the password settings
# ---------------------------------------------------------------------

# Set both, and set them before anyone tries to log in. With the client on
# a US layout and the user on a German keyboard, every password containing
# a character that moves between the layouts arrives wrong - a "-" typed on
# QWERTZ reaches the server as "/". The domain rejects it as a wrong
# password with nothing to suggest the layout is at fault, and the same
# credentials work perfectly when typed on the server.
#XKBLAYOUT=de
#CONSOLE_KEYMAP=de

# ---------------------------------------------------------------------
# Screens and services
# ---------------------------------------------------------------------

# SCREEN_07=ldm is the default (ltsp_config.d/15default-screen), and on a
# Debian client ldm.service runs screen_session 07 for it. ltsp-screen@ is
# shipped but not enabled; enable an instance only for an *additional*
# screen, and never one that collides with ldm's VT7.
#SCREEN_02=shell

# ldm reboots the client when it finds a newer image on the server. That is
# reasonable for an unattended fleet and startling for anyone sitting in
# front of one, so it is off unless asked for.
#LDM_NBD_CHECKUPDATE=True

# Services the thin-client cleanup would otherwise remove. "ssh" is useful
# while building an image and has no place in a production one.
#KEEP_SYSTEM_SERVICES="ssh"


# You can define sections to be included later on with "LIKE" directives.
[OLD_MONITOR]
# The following directives are useful in cases where the driver can't detect
# the (possibly old CRT) monitor timings and only offers low resolutions.
# Consult your monitor manual for the correct values, those are for 1024x768.
X_HORZSYNC=30.0-88.0
X_VERTREFRESH=50.0-88.0


# You can specify directives per client with MAC address (or IP or hostname)
# based sections.
# One way to get their MAC addresses is to run `arp -n` when they're at LDM.
#[A1:B1:C2:D4:E5:F6]
#HOSTNAME=pc01
#LDM_USERNAME=user01
#LDM_PASSWORD=pass01
#LTSP_FATCLIENT=False
# Include another section.
#LIKE=OLD_MONITOR
