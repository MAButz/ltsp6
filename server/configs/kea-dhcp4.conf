{
// Default LTSP Kea DHCPv4 config file.
// Equivalent to the classic dhcpd.conf/dnsmasq examples shipped alongside
// this file, for sites that use kea-dhcp4-server instead.
"Dhcp4": {
    "interfaces-config": {
        "interfaces": [ "*" ]
    },

    "lease-database": {
        "type": "memfile",
        "lfc-interval": 3600
    },

    "valid-lifetime": 28800,
    "renew-timer": 14400,
    "rebind-timer": 25200,

    // Used for network/PXE booting, just like dhcpd's "next-server".
    "next-server": "192.168.67.1",

    // Fallback boot filename for clients that don't match the
    // "ltsp-pxeclient" class below (e.g. plain DHCP clients).
    "boot-file-name": "/ltsp/i386/pxelinux.0",

    "option-data": [
        { "name": "domain-name", "data": "example.com" },
        { "name": "domain-name-servers", "data": "192.168.67.1" },
        { "name": "routers", "data": "192.168.67.1" }
    ],

    // Detect PXE ROM clients via the vendor-class-identifier (option 60),
    // the same test that dhcpd's "if substring(...)" and dnsmasq's
    // "dhcp-vendorclass=pxe,PXEClient" lines performed.
    "client-classes": [
        {
            "name": "ltsp-pxeclient",
            "test": "substring(option[60].hex,0,9) == 'PXEClient'",
            "boot-file-name": "/ltsp/i386/pxelinux.0"
        }
        // If you also have UEFI clients that need a different boot file
        // (e.g. grubx64.efi/bootx64.efi instead of pxelinux.0), add another
        // class here that additionally checks the client-system-architecture
        // (option 93), for example:
        //   "test": "substring(option[60].hex,0,9) == 'PXEClient' and
        //            option[93].hex == 0x0007",   // EFI x86-64
        //   "boot-file-name": "/ltsp/i386/grubx64.efi"
    ],

    "subnet4": [
        {
            "subnet": "192.168.67.0/24",
            "pools": [ { "pool": "192.168.67.20 - 192.168.67.250" } ]
        }
    ]

    // Note: unlike dnsmasq, Kea has no built-in "proxyDHCP" mode (handing out
    // only PXE boot info while another DHCP server on the network hands out
    // IP leases). If you need that, keep using `ltsp-config dnsmasq` on that
    // network segment instead of Kea.
}
}
