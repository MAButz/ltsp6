#
# HAProxy config for the ldm/xfreerdp RDP load balancer - HA pair, with
# separate staging and production environments (NIS2/KRITIS: a defined
# pilot client group validates updates on a live-but-separate backend
# pool before they reach everyone else). See server/doc/RDP-loadbalancer-HA
# for the full explanation, the keepalived side, and the Proxmox notes.
#
# Deploy this SAME config, unchanged, to both nodes of the keepalived
# pair (lb1 and lb2) - keepalived decides which one is currently active
# by moving the two virtual IPs (VIP_PROD, VIP_STAGING) between them;
# HAProxy itself doesn't need to know or care which node it's running on.
#
# Adjust: the VIP_PROD/VIP_STAGING bind addresses, and all backend
# server IPs, to your actual environment.
#

global
    log /dev/log local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    retries 3
    # RDP sessions are long-lived and often idle - HAProxy's defaults are
    # tuned for short HTTP requests and would otherwise silently kill
    # idle RDP connections.
    timeout connect 5s
    timeout client  6h
    timeout server  6h

# Recommended: a stats page to see backend health/load at a glance.
# Put this behind a firewall/VPN, not on the public frontend, and set a
# real password.
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    # stats auth admin:CHANGE_ME

# ---------------------------------------------------------------------
# Production: everyone except the staging pilot group. RDP_SERVER in
# lts.conf points here by default.
# ---------------------------------------------------------------------
frontend rdp_prod_in
    bind 10.0.0.100:3389   # VIP_PROD
    default_backend rdp_production

backend rdp_production
    # IP-hash: the same client IP always lands on the same backend, so a
    # thin client that disconnects and reconnects finds its existing
    # session again instead of getting a fresh one on a different server.
    balance source
    option tcp-check
    server prod-xrdp1 10.0.1.11:3389 check inter 5s
    server prod-xrdp2 10.0.1.12:3389 check inter 5s
    server prod-xrdp3 10.0.1.13:3389 check inter 5s

# ---------------------------------------------------------------------
# Staging: only the pilot client group. Their lts.conf sets
# RDP_SERVER=<VIP_STAGING> instead of the production VIP - a completely
# separate backend pool, running whatever update is being validated
# before it's rolled out to rdp_production above.
# ---------------------------------------------------------------------
frontend rdp_staging_in
    bind 10.0.0.101:3389   # VIP_STAGING
    default_backend rdp_staging

backend rdp_staging
    balance source
    option tcp-check
    server staging-xrdp1 10.0.2.11:3389 check inter 5s
