# keepalived.conf for lb1 (MASTER by default, higher priority).
# Deploy the near-identical counterpart (keepalived-lb2.conf) on lb2.
#
# Adjust: interface (the NIC name on your VM, e.g. ens18), the
# unicast_src_ip/unicast_peer IPs (lb1's and lb2's real addresses), and
# both virtual IPs to your actual VIP_PROD/VIP_STAGING addresses.

global_defs {
    # keepalived 2.x refuses to run vrrp_scripts otherwise (logs
    # "SECURITY VIOLATION - scripts are being executed but
    # script_security not enabled"). Combined with "user root" below,
    # since keepalived's own default script user (keepalived_script)
    # doesn't exist on a plain Debian install.
    enable_script_security
}

vrrp_script chk_haproxy {
    # Simplest possible health check: is haproxy actually running.
    # (You can make this stricter, e.g. curling the stats page, but a
    # dead process is the main failure mode this needs to catch.)
    script "/usr/bin/pgrep haproxy"
    user root
    interval 2
    # Negative weight: keepalived SUBTRACTS this from priority when the
    # script FAILS (a positive weight instead gets ADDED on success,
    # which does nothing useful here - the master's priority would never
    # actually drop, and the backup would never take over). -60 must be
    # enough to bring 150 (this node's base priority) below the backup's
    # 100, otherwise this node stays MASTER even with haproxy dead.
    weight -60
    fall 2
    rise 2
}

vrrp_instance VI_RDP_LB {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1

    # Unicast VRRP instead of multicast: more reliable across
    # Proxmox/virtualised networks that may filter multicast between
    # nodes on different physical hosts.
    unicast_src_ip 10.0.0.5
    unicast_peer {
        10.0.0.6
    }

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME
    }

    # Both the production and staging VIP move together: they're both
    # served by the same HAProxy process on this node, so there's no
    # reason to fail them over independently.
    virtual_ipaddress {
        10.0.0.100/24   # VIP_PROD
        10.0.0.101/24   # VIP_STAGING
    }

    track_script {
        chk_haproxy
    }
}
