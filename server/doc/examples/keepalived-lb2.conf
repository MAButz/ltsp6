# keepalived.conf for lb2 (BACKUP by default, lower priority).
# Counterpart to keepalived-lb1.conf - everything is the same except
# state/priority (so lb1 wins on boot/tie) and the unicast source/peer
# addresses (mirrored).

global_defs {
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/pgrep haproxy"
    user root
    interval 2
    weight -60
    fall 2
    rise 2
}

vrrp_instance VI_RDP_LB {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    unicast_src_ip 10.0.0.6
    unicast_peer {
        10.0.0.5
    }

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME
    }

    virtual_ipaddress {
        10.0.0.100/24   # VIP_PROD
        10.0.0.101/24   # VIP_STAGING
    }

    track_script {
        chk_haproxy
    }
}
