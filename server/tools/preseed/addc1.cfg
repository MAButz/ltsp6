# Preseed for the Samba Active Directory domain controller ("addc1").
#
# This host is the authentication base for the whole lab: the LTSP application
# servers, the file server holding the home directories and the load balancers
# all authenticate their users against it. It also ends up serving DNS for the
# ltsplab.local zone, because a Samba AD DC provides the SRV records domain
# members need to find it.
#
# The install only puts the packages in place; the domain itself is created
# afterwards with "samba-tool domain provision" (see server/doc/AD-DC-setup).

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string addc1
d-i netcfg/get_domain string ltsplab.local
d-i netcfg/wireless_wep string

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
# A domain controller is the time reference for its members: Kerberos rejects
# tickets once the clocks drift more than a few minutes apart.
d-i clock-setup/ntp boolean true

d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

d-i passwd/root-login boolean true
d-i passwd/root-password password proxmoxlab
d-i passwd/root-password-again password proxmoxlab
d-i passwd/make-user boolean false

d-i base-installer/kernel/image string linux-image-amd64
tasksel tasksel/first multiselect standard, ssh-server

# samba-dsdb-modules and samba-vfs-modules are what turn a plain Samba into
# one that can act as an AD DC; winbind resolves domain users and groups.
#
# krb5-user is what provides kinit/klist. krb5-config alone only writes the
# configuration, so without it there is no way to check on the DC itself that
# the realm actually issues tickets.
d-i pkgsel/include string sudo krb5-config krb5-user winbind samba samba-dsdb-modules samba-vfs-modules smbclient chrony
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# krb5-config would stop and ask for the realm interactively otherwise.
krb5-config krb5-config/default_realm string LTSPLAB.LOCAL
krb5-config krb5-config/add_servers_realm string LTSPLAB.LOCAL

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_in_progress note

# Power off instead of rebooting when the install is done.
#
# QEMU fixes the boot order when its process starts, so a guest-initiated
# reboot at the end of the install comes straight back to the still-attached
# installer ISO and installs again, forever. Powering off breaks that loop:
# detach the ISO, then start the VM into the installed system.
d-i debian-installer/exit/poweroff boolean true

d-i preseed/late_command string in-target sh -c "\
sed -i -E 's/^#?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config; \
grep -q '^PermitRootLogin yes' /etc/ssh/sshd_config || echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config; \
printf 'net.ipv6.conf.all.disable_ipv6 = 1\nnet.ipv6.conf.default.disable_ipv6 = 1\n' > /etc/sysctl.d/99-disable-ipv6.conf"
