# Preseed for the LTSP image server ("ltsp-root").
#
# This host builds and distributes the client images and does nothing else: it
# runs the chroot build (ltsp-build-client / ltsp-update-image), serves the
# kernel and initrd over TFTP, the squashfs over NBD, and answers PXE clients
# with proxy DHCP. It deliberately does NOT host user sessions - those live on
# the ltsp-app servers behind the load balancers.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string ltsp-root
d-i netcfg/get_domain string ltsplab.local
d-i netcfg/wireless_wep string

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
d-i clock-setup/ntp boolean true

d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

d-i passwd/root-login boolean true
d-i passwd/root-password password proxmoxlab
d-i passwd/root-password-again password proxmoxlab
d-i passwd/make-user boolean false

d-i base-installer/kernel/image string linux-image-amd64
tasksel tasksel/first multiselect standard, ssh-server

# debootstrap builds the client chroot, squashfs-tools turns it into the NBD
# image, nbd-server and tftpd-hpa hand both to the clients, and dnsmasq
# answers their PXE requests in proxy mode. ethtool is here because this is a
# nested virtualisation lab: see the offload note in the late_command below.
d-i pkgsel/include string sudo debootstrap squashfs-tools nbd-server tftpd-hpa dnsmasq ethtool rsync
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_in_progress note

# Power off instead of rebooting when the install is done.
#
# QEMU fixes the boot order when its process starts, so a guest-initiated
# reboot at the end of the install comes straight back to the still-attached
# installer ISO and installs again, forever. Powering off breaks that loop:
# detach the ISO, then start the VM into the installed system.
d-i debian-installer/exit/poweroff boolean true

# Two things the installer cannot express as debconf answers:
#  - root SSH login, so the host can be configured remotely from the start.
#  - IPv4 only. Debian mirrors resolve to IPv6 too, and with no IPv6 route in
#    this lab every AAAA connection stalls until it times out, which looks
#    like random hangs during apt runs.
d-i preseed/late_command string in-target sh -c "\
sed -i -E 's/^#?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config; \
grep -q '^PermitRootLogin yes' /etc/ssh/sshd_config || echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config; \
printf 'net.ipv6.conf.all.disable_ipv6 = 1\nnet.ipv6.conf.default.disable_ipv6 = 1\n' > /etc/sysctl.d/99-disable-ipv6.conf"
