# Kernel settings for a host running many desktop sessions at once.
#
# Deliberately short. Most of what circulates as "multi-user tuning" is
# already the default on Debian 13 and setting it again only makes the real
# changes harder to find - see README.Debian for what was left out and why.

# inotify limits are per-uid, so they are not divided among sessions - but one
# desktop session spends them freely: xfsettingsd, xfdesktop, Thunar, panel
# plugins, gvfs, tumbler and dconf all watch, before the user's own browser
# and editor start. VS Code alone asks for 524288 watches on a large
# workspace. Running out produces an obscure failure (inotify_init returning
# EMFILE, usually reported as "too many open files") rather than an honest
# error, so headroom is worth the kernel memory each watch costs (about 1 KB,
# and only when used).
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 524288

# Home directories live on NFS here. Every dentry or inode the kernel drops
# from cache turns the next lookup into a network round trip, and a desktop
# session does a great many small lookups. Halving the pressure keeps that
# metadata resident longer at the cost of a little more kernel memory.
# On a host whose homes are local, the default of 100 is fine.
vm.vfs_cache_pressure = 50

# Dirty page cache in absolute numbers instead of percentages of RAM. The
# defaults (10 % / 20 %) let a host with 192 GB collect up to ~38 GB of
# unwritten data and then write it out in one go, which stalls every session
# that writes meanwhile (seen as kworker "flush" threads and frozen
# applications). Writing back early and in small amounts keeps it smooth.
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 1073741824
