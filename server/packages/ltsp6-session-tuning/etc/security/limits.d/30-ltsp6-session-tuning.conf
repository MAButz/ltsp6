# Locked memory per process for login sessions.
#
# systemd's default is 8 MiB. Programs that keep secrets in locked memory, so
# that they never reach swap, need more: OTPClient (libgcrypt secure memory)
# warns "memlock value too low" below 64 MB, and password managers and
# smart-card middleware use the same mechanism. xrdp's PAM stack runs
# pam_limits, so this applies to every new RDP session.
#
# It is a per-process ceiling, not a reservation, and locked pages still count
# against the user's memory cgroup - 64 MB cannot be used to push a session
# past its slice limits. Value in KB.
*    -    memlock    65536
