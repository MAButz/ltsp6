# Desktop search indexer off on a session server - see README.Debian.
#
# Under a systemd user session the indexer is started by this unit rather
# than by its autostart entry. It indexes every home directory: with many
# sessions on one host that is a lot of I/O and CPU for a search few people
# use there. Create /etc/ltsp6/enable-desktop-search to allow it again.
[Unit]
ConditionPathExists=/etc/ltsp6/enable-desktop-search
